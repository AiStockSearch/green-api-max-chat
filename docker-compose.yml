services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GREEN_API_SAME_ORIGIN_PROXY: "true"
    image: green-api-max-chat:local
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
