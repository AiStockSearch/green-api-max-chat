name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Docker build
        run: docker build -t green-api-max-chat:ci .

      - name: Docker smoke (nginx headers + PWA)
        run: |
          docker run -d --name gac -p 8080:8080 green-api-max-chat:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
          check() { # url header-regex
            h=$(curl -sI "http://127.0.0.1:8080$1")
            echo "$h" | grep -iE "$2" >/dev/null || { echo "FAIL $1: expected /$2/"; echo "$h"; exit 1; }
            echo "ok $1 ~ $2"
          }
          check /sw.js 'cache-control: no-cache, no-store'
          check /sw.js 'content-type: (application|text)/javascript'
          check /manifest.webmanifest 'cache-control: no-cache'
          check /manifest.webmanifest 'content-type: application/manifest\+json'
          check /index.html 'cache-control: no-cache'
          check / 'cache-control: no-cache'
          asset=$(curl -s http://127.0.0.1:8080/ | grep -oE '/assets/[^"]+\.js' | head -1)
          check "$asset" 'cache-control: public, max-age=31536000, immutable'
          check /green-api-proxy/evil.example.com/x 'HTTP/1.1 403'
          CHROME_PATH=$(which google-chrome) node scripts/verify-pwa.mjs "http://127.0.0.1:8080/?demo=active"
          docker rm -f gac

  cypress-demo:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Cypress (demo specs, без секретов)
        run: |
          CYPRESS=1 npx start-server-and-test \
            "npm run dev -- --port 43128 --host 127.0.0.1" \
            http://127.0.0.1:43128 \
            "npx cypress run --spec cypress/e2e/03-partner-register-demo.cy.ts"

  cypress-live:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Check live secrets
        id: gate
        env:
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE }}
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
        run: |
          if [ -n "$GREEN_API_TOKEN" ] && [ -n "$GREEN_API_ID_INSTANCE" ] && [ -n "$GREEN_API_URL" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Live Cypress skipped: GREEN_API_ID_INSTANCE, GREEN_API_TOKEN, GREEN_API_URL not set"
          fi

      - run: npm ci
        if: steps.gate.outputs.run == 'true'

      - name: Write cypress.env.json from secrets
        if: steps.gate.outputs.run == 'true'
        env:
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          GREEN_API_CHAT_ID: ${{ secrets.GREEN_API_CHAT_ID }}
          GREEN_API_MESSENGER: ${{ vars.GREEN_API_MESSENGER || secrets.GREEN_API_MESSENGER || 'max' }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const cfg = {
            idInstance: process.env.GREEN_API_ID_INSTANCE,
            apiTokenInstance: process.env.GREEN_API_TOKEN,
            apiUrl: process.env.GREEN_API_URL,
            apiUrlDirect: process.env.GREEN_API_URL,
            chatId: process.env.GREEN_API_CHAT_ID || '',
            messenger: process.env.GREEN_API_MESSENGER || 'max',
            requireIncoming: false,
          }
          fs.writeFileSync('cypress.env.json', JSON.stringify(cfg, null, 2))
          NODE

      - name: Cypress (live specs)
        if: steps.gate.outputs.run == 'true'
        run: npm run cy:run -- --spec "cypress/e2e/01-api-credentials.cy.ts,cypress/e2e/02-instance-login-auth.cy.ts,cypress/e2e/04-instance-qr-live.cy.ts,cypress/e2e/05-live-send-receive.cy.ts"
