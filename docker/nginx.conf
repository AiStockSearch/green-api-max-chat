worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok\n';
    }

    # /green-api-proxy/7107/waInstance… → https://7107.api.greenapi.com/waInstance…
    location ~ ^/green-api-proxy/([0-9]+)(/.*)$ {
      set $shard $1;
      set $api_path $2;
      proxy_ssl_server_name on;
      proxy_set_header Host $shard.api.greenapi.com;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_pass https://$shard.api.greenapi.com$api_path$is_args$args;
    }

    # /green-api-proxy/7107.api.greenapi.com/… и api.green-api.com / api.greenapi.com
    location ~ ^/green-api-proxy/((?:[0-9]+\.api\.(?:green-api|greenapi)\.com|api\.(?:green-api|greenapi)\.com))(/.*)$ {
      set $upstream_host $1;
      set $api_path $2;
      proxy_ssl_server_name on;
      proxy_set_header Host $upstream_host;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_pass https://$upstream_host$api_path$is_args$args;
    }

    # Запрет open proxy: любой другой /green-api-proxy/*
    location ^~ /green-api-proxy/ {
      default_type application/json;
      return 403 '{"error":"green-api-proxy: host not allowed"}\n';
    }

    # PWA: service worker, манифест и app shell всегда перепроверяются (иначе обновления «залипают»)
    location = /sw.js {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Service-Worker-Allowed "/" always;
      try_files $uri =404;
    }

    location = /manifest.webmanifest {
      default_type application/manifest+json;
      types { }
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    location = /index.html {
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    # Хешированные ассеты Vite — неизменяемые
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
